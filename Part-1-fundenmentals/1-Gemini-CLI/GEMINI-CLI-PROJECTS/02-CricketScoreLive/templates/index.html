
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Scores</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Live Cricket Scores</h1>
    <table>
        <thead>
            <tr>
                <th>Match</th>
            </tr>
        </thead>
        <tbody>
            {% for score in scores %}
                <tr>
                    <td><a href="{{ score.link }}" target="_blank">{{ score.title }}</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
